<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Positivus Landing Page</title>
    <script type="module" src="js/main.js"></script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="icon" href="favicon.svg" />

    <meta
      name="description"
      content="Positivus - Digital Marketing Agency. We help businesses grow with SEO, PPC, and content marketing strategies."
    />
    <meta
      name="keywords"
      content="digital marketing, SEO, PPC, content marketing, social media"
    />
    <meta name="author" content="Positivus" />

    <meta property="og:title" content="Positivus - Digital Marketing Agency" />
    <meta
      property="og:description"
      content="Navigate the digital landscape for success"
    />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Positivus - Digital Marketing Agency" />
    <meta
      name="twitter:description"
      content="Navigate the digital landscape for success"
    />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <div class="app">
      <header class="header">
        <div class="container">
          <a
            href="https://github.com/Hihiz"
            target="_blank"
            rel="noopener noreferrer"
          >
            <img
              src="img/logos/default-logo.svg"
              width="160"
              height="40"
              alt="Логотип сайта"
          /></a>

          <button
            class="hamburger-button"
            type="button"
            aria-label="Открыть меню"
            aria-expanded="false"
            aria-controls="hamburger-menu"
          >
            <span></span>
            <span></span>
            <span></span>
          </button>

          <nav class="nav-menu" aria-label="Основная навигация">
            <ul class="hamburger-menu" id="hamburger-menu">
              <li>
                <a href="#">About us</a>
              </li>
              <li>
                <a href="#services">Services</a>
              </li>
              <li>
                <a href="#use-cases">Use Cases</a>
              </li>
              <li>
                <a href="#pricing">Pricing</a>
              </li>
              <li>
                <a href="#blog">Blog</a>
              </li>
              <li>
                <a
                  href="https://github.com/Hihiz"
                  target="_blank"
                  rel="noopener noreferrer"
                  class="button-request"
                  >Request a quote</a
                >
              </li>
            </ul>
          </nav>
        </div>
      </header>
  </body>
</html>
